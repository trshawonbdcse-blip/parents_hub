<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Samm-sammult Estonian</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; the course path is three flag stripes (sinine, must, valge) that fill as units are passed. */
:root {
  --paper: #f4f6f9;
  --card: #ffffff;
  --ink: #121821;
  --muted: #586473;
  --line: #d6dde6;
  --accent: #0072ce;
  --accent-ink: #0a5aa6;
  --accent-soft: #e3effa;
  --good: #1d7f47;
  --good-soft: #e2f3e9;
  --bad: #b8402b;
  --bad-soft: #fbe9e5;
  --flag-blue: #0072ce;
  --flag-black: #10151c;
  --flag-white: #ffffff;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1218; --card: #151c25; --ink: #e7ecf2; --muted: #9ba7b5; --line: #29333f;
    --accent: #5aa9f0; --accent-ink: #8cc4f6; --accent-soft: #15283b;
    --good: #5cc98b; --good-soft: #13291d; --bad: #f08a72; --bad-soft: #33191380;
    --flag-black: #000000; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1218; --card: #151c25; --ink: #e7ecf2; --muted: #9ba7b5; --line: #29333f;
  --accent: #5aa9f0; --accent-ink: #8cc4f6; --accent-soft: #15283b;
  --good: #5cc98b; --good-soft: #13291d; --bad: #f08a72; --bad-soft: #33191380;
  --flag-black: #000000; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.55;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
a { color: var(--accent-ink); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--card); border-bottom: 1px solid var(--line);
}
.wrap {
  max-width: 820px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar .wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; }
.mini-flag { display: inline-grid; grid-template-rows: repeat(3, 5px); width: 24px; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.mini-flag i:nth-child(1) { background: var(--flag-blue); }
.mini-flag i:nth-child(2) { background: var(--flag-black); }
.mini-flag i:nth-child(3) { background: var(--flag-white); }
nav.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav.tabs button {
  font-family: var(--f-display); font-weight: 600; font-size: 0.92rem;
  background: none; border: 0; padding: 6px 12px; border-radius: 999px; cursor: pointer; color: var(--muted);
}
nav.tabs button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); }

main { padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; letter-spacing: -0.015em; margin: 0; }
h1 { font-size: clamp(1.9rem, 5vw, 2.7rem); font-weight: 800; }
h2 { font-size: 1.45rem; font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 600; }
.eyebrow { font-family: var(--f-display); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 62ch; margin: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 36px; }

/* Flag progress */
.flag { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--card); }
.stripe { position: relative; height: 34px; display: flex; align-items: center; padding-left: 12px; background: repeating-linear-gradient(135deg, var(--line) 0 2px, transparent 2px 9px); }
.stripe + .stripe { border-top: 1px solid var(--line); }
.stripe .fill { position: absolute; inset: 0 auto 0 0; transition: width .5s ease; }
.stripe[data-l="A1"] .fill { background: var(--flag-blue); }
.stripe[data-l="A2"] .fill { background: var(--flag-black); }
.stripe[data-l="B1"] .fill { background: var(--flag-white); }
.stripe span {
  position: relative; font-family: var(--f-mono); font-size: 0.8rem; font-weight: 500;
  background: var(--card); color: var(--ink); padding: 1px 8px; border-radius: 4px; border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.flag-note { font-size: 0.88rem; color: var(--muted); margin: 0; }

/* Level + unit list */
.level-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.level-head .tag { font-family: var(--f-mono); font-weight: 500; font-size: 0.85rem; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--ink); }
.level-head p { margin: 0; color: var(--muted); font-size: 0.95rem; flex-basis: 100%; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.unit-btn {
  text-align: left; cursor: pointer; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center;
}
.unit-btn:hover { border-color: var(--accent); }
.unit-btn .n { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); grid-column: 1; grid-row: 1 / span 2; }
.unit-btn .t { font-family: var(--f-display); font-weight: 600; line-height: 1.2; grid-column: 2; grid-row: 1; }
.unit-btn .e { font-size: 0.85rem; color: var(--muted); grid-column: 2; grid-row: 2; }
.unit-btn .s { grid-column: 3; grid-row: 1 / span 2; }
.chip { font-family: var(--f-mono); font-size: 0.72rem; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.pass { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.try { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }

/* Unit page */
.back { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent-ink); font-family: var(--f-display); font-weight: 600; font-size: 0.92rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 16px; border-radius: 999px; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 0.92rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.grammar { min-width: 0; }
.grammar p { margin: 0 0 12px; max-width: 64ch; }
.grammar p:last-child { margin-bottom: 0; }
.grammar b, .ex .et b { color: var(--accent-ink); font-weight: 600; }
.tbl-wrap { overflow-x: auto; margin: 4px 0 14px; }
table { border-collapse: collapse; font-size: 0.92rem; min-width: 100%; }
th, td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-display); font-weight: 600; font-size: 0.78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.f, .f { font-family: var(--f-mono); font-size: 0.88rem; }
.vocab { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0 24px; }
.vocab li { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.vocab .et { font-family: var(--f-display); font-weight: 600; }
.vocab .en { color: var(--muted); font-size: 0.92rem; margin-left: auto; text-align: right; }
.say { border: 1px solid var(--line); background: none; border-radius: 999px; width: 26px; height: 26px; cursor: pointer; font-size: 0.7rem; color: var(--accent-ink); flex: none; display: inline-grid; place-items: center; }
.ex { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.ex li { border-left: 3px solid var(--accent); padding-left: 12px; }
.ex .et { font-family: var(--f-display); font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ex .en { color: var(--muted); font-size: 0.92rem; }

/* Flashcards */
.card-stage { display: grid; gap: 14px; justify-items: center; }
.flash {
  width: 100%; max-width: 460px; min-height: 210px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); display: grid; place-items: center; text-align: center; padding: 24px; cursor: pointer;
  box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(0, 40, 90, .35);
}
.flash .big { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 6vw, 2.3rem); line-height: 1.1; overflow-wrap: anywhere; }
.flash .small { color: var(--muted); margin-top: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 16px; cursor: pointer;
  font-family: var(--f-display); font-weight: 600; font-size: 0.95rem;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.btn.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.btn.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.meta { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Quiz */
.q-prompt { font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; line-height: 1.3; overflow-wrap: anywhere; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.choice { text-align: left; padding: 12px 14px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; cursor: pointer; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.choice.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.answer { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-family: var(--f-display); font-size: 1.1rem; }
.keys { display: flex; gap: 6px; flex-wrap: wrap; }
.keys button { min-width: 38px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); cursor: pointer; font-family: var(--f-display); font-weight: 600; }
.feedback { padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; }
.feedback.ok { background: var(--good-soft); color: var(--good); }
.feedback.no { background: var(--bad-soft); color: var(--bad); }
.progress-line { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress-line i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.score { font-family: var(--f-display); font-weight: 800; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* Reference */
.res { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.res a { display: block; text-decoration: none; color: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--card); }
.res a:hover { border-color: var(--accent); }
.res b { font-family: var(--f-display); display: block; color: var(--accent-ink); }
.res span { font-size: 0.9rem; color: var(--muted); }
.plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.plan div { border-top: 4px solid var(--line); padding-top: 10px; }
.plan div:nth-child(1) { border-color: var(--flag-blue); }
.plan div:nth-child(2) { border-color: var(--flag-black); }
.plan div:nth-child(3) { border-color: var(--muted); }
.plan p { margin: 6px 0 0; font-size: 0.93rem; }
.small-note { font-size: 0.85rem; color: var(--muted); }
.danger { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <button class="brand" id="brand" type="button"><span class="mini-flag" aria-hidden="true"><i></i><i></i><i></i></span>Samm-sammult</button>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-view="path" id="tab-path">Course</button>
      <button type="button" data-view="review" id="tab-review">Review</button>
      <button type="button" data-view="ref" id="tab-ref">Reference</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
/* ---------- Course data ---------- */
const LEVELS = [
  { id: "A1", name: "Algaja", en: "Beginner",
    blurb: "Greet people, count, shop, talk about family, days and where things are. Present tense and the first cases." },
  { id: "A2", name: "Edasijõudnud algaja", en: "Elementary",
    blurb: "Talk about the past, health, home and travel. Partitive objects, inner and outer place cases, modal verbs." },
  { id: "B1", name: "Iseseisev keelekasutaja", en: "Independent user",
    blurb: "Express wishes and opinions, work and society topics. Conditional, impersonal, plurals and reported speech." }
];

const UNITS = [
/* ================= A1 ================= */
{ id: "a1-1", level: "A1", title: "Tervitused", en: "Greetings and the verb olema",
words: `tere|hello
tere hommikust|good morning
tere õhtust|good evening
head ööd|good night
head aega|goodbye
nägemist|bye, see you
aitäh|thank you
palun|please; here you go
vabandust|sorry, excuse me
jah|yes
ei|no
kuidas läheb?|how are you?
hästi|well, fine
meeldiv tutvuda|nice to meet you`,
grammar: `<p>Estonian has <b>no articles</b> (no "a" or "the") and <b>no grammatical gender</b>. <b>ta</b> or <b>tema</b> means both "he" and "she".</p>
<p>Every pronoun has a long and a short form: <b>mina/ma</b>, <b>sina/sa</b>, <b>tema/ta</b>, <b>meie/me</b>, <b>teie/te</b>, <b>nemad/nad</b>. Use the short form normally and the long form for emphasis. <b>Teie</b> is also the polite "you".</p>
<div class="tbl-wrap"><table><tr><th>olema · to be</th><th></th><th></th></tr>
<tr><td class="f">ma olen</td><td>I am</td><td class="f">me oleme</td></tr>
<tr><td class="f">sa oled</td><td>you are</td><td class="f">te olete</td></tr>
<tr><td class="f">ta on</td><td>he / she is</td><td class="f">nad on</td></tr></table></div>
<p>Stress almost always falls on the <b>first syllable</b>: <i>TE-re, NÄ-ge-mist, PA-lun</i>. One famous exception: <i>ai-TÄH</i>.</p>`,
examples: [["Tere! Minu nimi on Anna.", "Hello! My name is Anna."], ["Mis sinu nimi on?", "What is your name?"], ["Ma olen pärit Bangladeshist.", "I am from Bangladesh."], ["Kuidas läheb? – Hästi, aitäh!", "How are you? – Fine, thanks!"], ["Ta on õpetaja.", "He / she is a teacher."], ["Me oleme sõbrad.", "We are friends."]],
drills: [["Ma ___ õpilane. (olema)", "olen", "I am a pupil."], ["Nad ___ kodus. (olema)", "on", "They are at home."], ["Me ___ sõbrad. (olema)", "oleme", "We are friends."], ["Sa ___ väga tubli. (olema)", "oled", "You are very good."], ["Thank you →", "aitäh", ""]]
},
{ id: "a1-2", level: "A1", title: "Numbrid ja kell", en: "Numbers and telling the time",
words: `üks|one (1)
kaks|two (2)
kolm|three (3)
neli|four (4)
viis|five (5)
kuus|six (6)
seitse|seven (7)
kaheksa|eight (8)
üheksa|nine (9)
kümme|ten (10)
üksteist|eleven (11)
kakskümmend|twenty (20)
sada|a hundred (100)
tuhat|a thousand (1000)
kell|clock; o'clock
pool|half`,
grammar: `<p>Numbers are built like Lego. Add <b>-teist</b> for 11–19 and <b>-kümmend</b> for the tens, <b>-sada</b> for hundreds.</p>
<div class="tbl-wrap"><table><tr><th>Pattern</th><th>Example</th><th></th></tr>
<tr><td>number + teist</td><td class="f">kolmteist</td><td>13</td></tr>
<tr><td>number + kümmend</td><td class="f">nelikümmend</td><td>40</td></tr>
<tr><td>tens + units</td><td class="f">kakskümmend viis</td><td>25</td></tr>
<tr><td>number + sada</td><td class="f">kolmsada</td><td>300</td></tr></table></div>
<p><b>Mis kell on?</b> – What time is it? <b>Kell on kolm.</b> – It is three o'clock.</p>
<p>Careful: Estonians count half hours <b>towards the next hour</b>. <b>pool neli</b> ("half four") means <b>3:30</b>. <b>veerand neli</b> = 3:15, <b>kolmveerand neli</b> = 3:45.</p>`,
examples: [["Mis kell on? – Kell on viis.", "What time is it? – It's five."], ["Kell on pool kuus.", "It's half past five (5:30)."], ["Kui vana sa oled? – Ma olen kolmkümmend aastat vana.", "How old are you? – I'm thirty."], ["Buss tuleb kell kaheksa.", "The bus comes at eight."]],
drills: [["13 = kolm___ (write the whole word)", "kolmteist", ""], ["40 = ?", "nelikümmend", ""], ["7:30 = pool ___", "kaheksa", "half towards eight"], ["Mis ___ on? (What time is it?)", "kell", ""], ["25 = ?", "kakskümmend viis", ""]]
},
{ id: "a1-3", level: "A1", title: "Pere", en: "Family, possession, plural",
words: `ema|mother
isa|father
vend|brother
õde|sister
poeg|son
tütar|daughter
laps|child
mees|man; husband
naine|woman; wife
abikaasa|spouse
vanaema|grandmother
vanaisa|grandfather
sõber|friend
pere|family`,
grammar: `<p><b>Possessives</b> stand before the noun and never change for gender.</p>
<div class="tbl-wrap"><table><tr><th>Long</th><th>Short</th><th></th></tr>
<tr><td class="f">minu</td><td class="f">mu</td><td>my</td></tr><tr><td class="f">sinu</td><td class="f">su</td><td>your</td></tr>
<tr><td class="f">tema</td><td class="f">ta</td><td>his / her</td></tr><tr><td class="f">meie</td><td class="f">me</td><td>our</td></tr>
<tr><td class="f">teie</td><td class="f">te</td><td>your (pl.)</td></tr><tr><td class="f">nende</td><td class="f">–</td><td>their</td></tr></table></div>
<p><b>"I have" has no verb "have".</b> Estonian says "on me is": <b>mul on</b>, sul on, tal on, meil on, teil on, neil on. <i>Mul on vend.</i> – I have a brother.</p>
<p><b>Plural</b> (nominative) ends in <b>-d</b>: ema → ema<b>d</b>, laps → laps<b>ed</b>, sõber → sõbra<b>d</b>, õde → õe<b>d</b>. The stem can change, so learn the plural with each word.</p>`,
examples: [["Mul on kaks last.", "I have two children."], ["Minu õde elab Tartus.", "My sister lives in Tartu."], ["Tema abikaasa on arst.", "His / her spouse is a doctor."], ["Meie lapsed on koolis.", "Our children are at school."], ["Kas sul on vend või õde?", "Do you have a brother or a sister?"]],
drills: [["___ on vend. (I have)", "mul", "Mul on vend."], ["Meie ___ on koolis. (laps, plural)", "lapsed", ""], ["Neil ___ koer. (they have)", "on", ""], ["sister →", "õde", ""], ["Tal on kaks ___ (sõber, after a number)", "sõpra", "Numbers take the partitive: kaks sõpra."]]
},
{ id: "a1-4", level: "A1", title: "Verbid olevikus", en: "Present tense, negation, questions",
words: `elama|to live
töötama|to work
õppima|to study, learn
rääkima|to speak
tegema|to do, make
minema|to go
tulema|to come
sööma|to eat
jooma|to drink
lugema|to read
kirjutama|to write
magama|to sleep
teadma|to know
armastama|to love`,
grammar: `<p>Dictionary verbs end in <b>-ma</b>. Drop it and add the person ending. The ending tells you the person, so the pronoun is often optional.</p>
<div class="tbl-wrap"><table><tr><th></th><th>elama</th><th>rääkima</th><th>tegema</th><th>minema</th></tr>
<tr><td>ma -n</td><td class="f">elan</td><td class="f">räägin</td><td class="f">teen</td><td class="f">lähen</td></tr>
<tr><td>sa -d</td><td class="f">elad</td><td class="f">räägid</td><td class="f">teed</td><td class="f">lähed</td></tr>
<tr><td>ta -b</td><td class="f">elab</td><td class="f">räägib</td><td class="f">teeb</td><td class="f">läheb</td></tr>
<tr><td>me -me</td><td class="f">elame</td><td class="f">räägime</td><td class="f">teeme</td><td class="f">läheme</td></tr>
<tr><td>te -te</td><td class="f">elate</td><td class="f">räägite</td><td class="f">teete</td><td class="f">lähete</td></tr>
<tr><td>nad -vad</td><td class="f">elavad</td><td class="f">räägivad</td><td class="f">teevad</td><td class="f">lähevad</td></tr></table></div>
<p><b>Negation is easy:</b> <b>ei</b> + the bare stem, same for every person: ma <b>ei räägi</b>, nad <b>ei räägi</b>.</p>
<p><b>Yes/no questions</b> start with <b>Kas</b>: <i>Kas sa räägid eesti keelt?</i></p>`,
examples: [["Ma elan Tallinnas.", "I live in Tallinn."], ["Kus sa töötad?", "Where do you work?"], ["Ta õpib eesti keelt.", "He / she is learning Estonian."], ["Kas sa räägid eesti keelt? – Natuke.", "Do you speak Estonian? – A little."], ["Ma ei tea.", "I don't know."], ["Me sööme kell kuus.", "We eat at six."]],
drills: [["Ma ___ Tartus. (elama)", "elan", ""], ["Nad ___ kohvi. (jooma)", "joovad", ""], ["Me ___ eesti keelt. (õppima)", "õpime", "õppima → õpi- (the double p shortens)"], ["Ma ei ___. (teadma)", "tea", ""], ["Sa ___ hästi eesti keelt. (rääkima)", "räägid", ""]]
},
{ id: "a1-5", level: "A1", title: "Toit ja pood", en: "Food, shopping, numbers + partitive",

õun|apple

odav|cheap`,
grammar: `<p>After any number from <b>2</b> upward, the noun goes into the <b>partitive</b> case (osastav) and stays singular.</p>
<div class="tbl-wrap"><table><tr><th>one</th><th>two +</th></tr>
<tr><td class="f">üks õun</td><td class="f">kaks õun<b>a</b></td></tr>
<tr><td class="f">üks euro</td><td class="f">kolm euro<b>t</b></td></tr>
<tr><td class="f">üks kartul</td><td class="f">viis kartuli<b>t</b></td></tr>
<tr><td class="f">üks juust</td><td class="f">kaks juust<b>u</b></td></tr></table></div>
<p>Partitive endings are <b>-a/-e/-i/-u</b>, <b>-t</b> or <b>-d</b>. You will learn to hear them; for now, learn the phrase as a chunk.</p>
<p>Shop phrases: <b>Kui palju see maksab?</b> – How much is it? <b>Palun üks kohv.</b> – One coffee, please.</p>`,
examples: [["Palun üks kohv ja kaks saia.", "One coffee and two buns, please."], ["Kui palju see maksab? – Kolm eurot.", "How much is it? – Three euros."], ["Ma ostan leiba ja piima.", "I'm buying bread and milk."], ["Kas kaardiga saab maksta?", "Can I pay by card?"], ["See on liiga kallis.", "This is too expensive."]],

},

grammar: `<p>Days are written in <b>lowercase</b>. The weekdays count from Monday: <i>esmas-</i> (first), <i>teisi-</i> (second), <i>kolma-</i> (third), <i>nelja-</i> (fourth).</p>

<p>Weather: <b>Sajab vihma.</b> (It's raining, literally "rain is falling"), <b>Sajab lund.</b> (It's snowing), <b>Paistab päike.</b> (The sun is shining), <b>On külm / soe.</b> (It's cold / warm).</p>`,

{ id: "a1-7", level: "A1", title: "Linnas", en: "In town: where, to where, from where",
words: `pood|shop
kool|school
kodu|home

grammar: `<p>Estonian answers three questions with three endings: <b>Kuhu?</b> (to where) <b>Kus?</b> (where) <b>Kust?</b> (from where).</p>
<div class="tbl-wrap"><table><tr><th>word</th><th>kuhu? into</th><th>kus? in</th><th>kust? out of</th></tr>
<tr><td class="f">kool</td><td class="f">kooli / koolisse</td><td class="f">koolis</td><td class="f">koolist</td></tr>
<tr><td class="f">pood</td><td class="f">poodi</td><td class="f">poes</td><td class="f">poest</td></tr>

<p>The general endings are <b>-sse / -s / -st</b>. Common words often have a short "into" form (poodi, kooli, koju) that you simply memorise.</p>`,
examples: [["Kus on apteek?", "Where is the pharmacy?"], ["Mine otse ja siis vasakule.", "Go straight and then left."], ["Ma lähen poodi.", "I'm going to the shop."], ["Lapsed on koolis.", "The children are at school."], ["Ma tulen kodust.", "I'm coming from home."]],

grammar: `<p>Most verbs form the past with <b>-si-</b> + the person ending.</p>
<div class="tbl-wrap"><table><tr><th></th><th>elama</th><th>minema (irregular)</th></tr>
<tr><td>ma</td><td class="f">ela<b>sin</b></td><td class="f">läksin</td></tr>

<p>Short irregular verbs: olin, tulin, tegin, nägin, sõin, jõin.</p>
<p><b>Past negation</b> uses <b>ei + -nud</b> for every person: ma <b>ei olnud</b>, ta <b>ei läinud</b>, nad <b>ei teinud</b>, me <b>ei söönud</b>.</p>`,

{ id: "a2-2", level: "A2", title: "Osastav", en: "The partitive object, likes and dislikes",
words: `raamat|book
ajaleht|newspaper
muusika|music
aeg|time
meeldima|to be liked, to please
armastama|to love
vihkama|to hate
ootama|to wait (for)
vajama|to need
otsima|to look for
aitama|to help
küsima|to ask
vastama|to answer`,
grammar: `<p>The partitive is the most used case in Estonian. Use it for the object when:</p>
<p>1. the sentence is <b>negative</b>: <i>Mul ei ole auto<b>t</b>.</i> (I don't have a car.)<br>2. the action is <b>ongoing or unfinished</b>: <i>Ma loen raamatu<b>t</b>.</i> (I'm reading a book.)<br>3. the verb always takes it: <b>armastama, ootama, otsima, aitama, vihkama</b>.</p>
<p>A finished, whole object takes the genitive instead: <i>Ma lugesin raamatu läbi.</i> (I read the book through.)</p>
<p><b>"I like"</b> is built backwards: "to me is pleasing". <b>Mulle meeldib</b> muusika. Mulle, sulle, talle, meile, teile, neile.</p>
<div class="tbl-wrap"><table><tr><th>pronoun</th><th>partitive</th></tr>
<tr><td class="f">mina · sina · tema</td><td class="f">mind · sind · teda</td></tr>
<tr><td class="f">meie · teie · nemad</td><td class="f">meid · teid · neid</td></tr></table></div>`,
examples: [["Ma loen raamatut.", "I'm reading a book."], ["Ma ootan sind.", "I'm waiting for you."], ["Mul ei ole aega.", "I don't have time."], ["Mulle meeldib eesti muusika.", "I like Estonian music."], ["Kas sa saad mind aidata?", "Can you help me?"]],
drills: [["Mul ei ole ___. (auto)", "autot", ""], ["Ma ootan ___. (buss)", "bussi", ""], ["Ma armastan ___. (sina)", "sind", ""], ["___ meeldib muusika. (I like)", "mulle", ""], ["Ma otsin ___. (tema)", "teda", ""]]
},
{ id: "a2-3", level: "A2", title: "Sees ja peal", en: "Inner and outer place cases",
words: `Eesti|Estonia
tööle|to work
tööl|at work
töölt|from work
maa|countryside; land
meri|sea
saar|island
mets|forest
rand|beach
järv|lake
turg|market
laud|table
tagasi|back; ago
praegu|right now`,
grammar: `<p>There are two sets of place endings. <b>Inner</b> (inside something) and <b>outer</b> (on a surface, at a place or an event).</p>
<div class="tbl-wrap"><table><tr><th></th><th>to</th><th>at / in</th><th>from</th></tr>
<tr><td>inner</td><td class="f">-sse</td><td class="f">-s</td><td class="f">-st</td></tr>
<tr><td>outer</td><td class="f">-le</td><td class="f">-l</td><td class="f">-lt</td></tr>
<tr><td class="f">Eesti</td><td class="f">Eestisse</td><td class="f">Eestis</td><td class="f">Eestist</td></tr>
<tr><td class="f">töö</td><td class="f">tööle</td><td class="f">tööl</td><td class="f">töölt</td></tr>
<tr><td class="f">laud</td><td class="f">lauale</td><td class="f">laual</td><td class="f">laualt</td></tr>
<tr><td class="f">Saaremaa</td><td class="f">Saaremaale</td><td class="f">Saaremaal</td><td class="f">Saaremaalt</td></tr></table></div>
<p>The outer cases are used for work, the countryside (maal), the market (turul), and most islands. Countries and cities use inner cases.</p>`,
examples: [["Ma kolisin Eestisse kaks aastat tagasi.", "I moved to Estonia two years ago."], ["Ta on praegu tööl.", "He / she is at work right now."], ["Suvel me läheme maale.", "In summer we go to the countryside."], ["Raamat on laual.", "The book is on the table."], ["Ma tulin just töölt.", "I just came from work."]],
drills: [["Ma elan ___. (Eesti, in)", "Eestis", ""], ["Ma lähen homme ___. (töö, to)", "tööle", ""], ["Me sõidame ___. (Saaremaa, to)", "Saaremaale", ""], ["Raamat on ___. (laud, on)", "laual", ""], ["Ta tuli ___. (Tallinn, from)", "Tallinnast", ""]]
},
{ id: "a2-4", level: "A2", title: "Tervis", en: "Body, health, the doctor",
words: `pea|head
käsi|hand; arm
jalg|leg; foot
silm|eye
kõrv|ear
kõht|stomach
selg|back
hammas|tooth
arst|doctor
perearst|family doctor (GP)
haige|sick, ill
palavik|fever
köha|cough
rohi|medicine
retsept|prescription`,
grammar: `<p>Feelings and symptoms use the same <b>mul on</b> structure as possession:</p>
<p><b>Mul on palavik.</b> – I have a fever. <b>Mul on külm.</b> – I feel cold. <b>Mul on kõht tühi.</b> – I'm hungry ("my stomach is empty").</p>
<p>Pain: <b>Mul valutab</b> + body part. <i>Mul valutab pea.</i> – I have a headache.</p>
<p>Going to a person uses <b>juurde</b> (to), <b>juures</b> (at), <b>juurest</b> (from) after the genitive: <i>arsti juurde, arsti juures</i>.</p>
<p>In Estonia you first call your <b>perearst</b> (family doctor). The free 24/7 family-doctor advice line is <b>1220</b>.</p>`,
examples: [["Mul valutab hammas.", "I have a toothache."], ["Ma olen haige ja ei saa tööle tulla.", "I'm sick and can't come to work."], ["Mul on vaja perearsti juurde minna.", "I need to go to the family doctor."], ["Võtke seda rohtu kolm korda päevas.", "Take this medicine three times a day."], ["Kus valutab?", "Where does it hurt?"]],
drills: [["Mul ___ pea. (aches)", "valutab", ""], ["Mul on ___. (fever)", "palavik", ""], ["Ma pean ___ juurde minema. (arst)", "arsti", ""], ["family doctor →", "perearst", ""], ["tooth →", "hammas", ""]]
},
{ id: "a2-5", level: "A2", title: "Tahan, pean, oskan", en: "Modal verbs and the two infinitives",
words: `tahtma|to want
võima|may, can (be allowed)
pidama|must, have to
saama|can, be able; to get
oskama|to know how
hakkama|to start
proovima|to try
unustama|to forget
mäletama|to remember
õpetama|to teach
ujuma|to swim
ärkama|to wake up`,
grammar: `<p>Estonian has two infinitives. Which one you use depends on the <b>first verb</b>.</p>
<div class="tbl-wrap"><table><tr><th>-da infinitive after…</th><th>-ma infinitive after…</th></tr>
<tr><td>tahtma, võima, saama, oskama, proovima, meeldima, (on) vaja</td><td>pidama, hakkama, minema, tulema, õppima, aitama</td></tr>
<tr><td class="f">Ma tahan õppi<b>da</b>.</td><td class="f">Ma pean õppi<b>ma</b>.</td></tr></table></div>
<p>Common -da forms to memorise: olla, minna, tulla, teha, süüa, juua, lugeda, rääkida, elada, õppida, ujuda.</p>
<p><b>Ma saan aru</b> = I understand. <b>Ma ei saa aru</b> = I don't understand. You'll use these a lot.</p>`,
examples: [["Ma tahan õppida eesti keelt.", "I want to learn Estonian."], ["Ma pean homme vara ärkama.", "I have to wake up early tomorrow."], ["Kas ma võin siia istuda?", "May I sit here?"], ["Ma oskan natuke eesti keelt rääkida.", "I can speak a little Estonian."], ["Me hakkame kohe sööma.", "We're about to start eating."]],
drills: [["Ma tahan kohvi ___. (jooma)", "juua", ""], ["Ma pean tööle ___. (minema)", "minema", ""], ["Kas sa oskad ___? (ujuma)", "ujuda", ""], ["Ma hakkan eesti keelt ___. (õppima)", "õppima", ""], ["Ma ei saa homme ___. (tulema)", "tulla", ""]]
},

grammar: `<p><b>Comparative:</b> add <b>-m</b> to the genitive stem, and use <b>kui</b> for "than".</p>

<p><i>Minu tuba on väiksem kui sinu oma.</i> – My room is smaller than yours.</p>

{ id: "a2-7", level: "A2", title: "Reisimine", en: "Transport and travel",
words: `buss|bus
tramm|tram
rong|train
lennuk|plane
laev|ship, ferry
jalgratas|bicycle
takso|taxi
pilet|ticket
peatus|stop

sadam|harbour, port
lennujaam|airport

väljuma|to depart`,
grammar: `<p><b>-ga</b> (comitative) = "with" or "by": bussi<b>ga</b>, rongi<b>ga</b>, sõbra<b>ga</b>, jalgratta<b>ga</b>.</p>
<p><b>-ta</b> (abessive) = "without": pileti<b>ta</b>, raha<b>ta</b>. Often with <b>ilma</b> in front: <i>ilma piletita</i>.</p>
<p>Both endings attach to the <b>genitive</b> stem (jalgratas → jalgratta → jalgrattaga), so learning the genitive of each new noun pays off.</p>
<p>Moving by vehicle uses <b>sõitma</b>; moving on foot uses <b>minema</b> or <b>kõndima</b>. <i>Ma lähen jalgsi.</i> – I'll walk.</p>`,
examples: [["Ma sõidan tööle trammiga.", "I go to work by tram."], ["Üks pilet Tartusse, palun.", "One ticket to Tartu, please."], ["Laev Helsingisse väljub kell kümme.", "The ferry to Helsinki departs at ten."], ["Kus on lähim bussipeatus?", "Where is the nearest bus stop?"], ["Ära sõida piletita!", "Don't ride without a ticket!"]],

grammar: `<p><b>Perfect</b> (täisminevik) = <b>olema</b> in the present + the <b>-nud</b> form. It is used for experiences and things that still matter now.</p>
<div class="tbl-wrap"><table><tr><th></th><th></th></tr>
<tr><td class="f">Ma olen Tartus käi<b>nud</b>.</td><td>I have been to Tartu.</td></tr>

<tr><td class="f">Ma olin juba söö<b>nud</b>.</td><td>I had already eaten. (pluperfect)</td></tr></table></div>
<p><b>Future:</b> Estonian has no separate future tense. Use the present with a time word (<i>Homme ma lähen…</i>), <b>hakkama + -ma</b> for starting something, or <b>kavatsema + -da</b> for plans.</p>`,

grammar: `<p>Five small endings that do a lot of work. All attach to the genitive stem.</p>
<div class="tbl-wrap"><table><tr><th>ending</th><th>meaning</th><th>example</th></tr>
<tr><td class="f">-ks</td><td>becoming (translative)</td><td class="f">Ta sai arsti<b>ks</b>.</td></tr>

<p>These are the four cases where an adjective does <b>not</b> copy the ending: <i>suure maja<b>ni</b></i>, <i>uue sõbra<b>ga</b></i>, not "suureni majani".</p>`,

grammar: `<p>Plural case forms are built on the <b>genitive plural</b>, which ends in <b>-de</b> or <b>-te</b>. Find it, then add the normal endings.</p>

{ id: "b1-5", level: "B1", title: "Kaudne kõnelemine", en: "Reported speech and certainty",
words: `ütlema|to say

selguma|to turn out`,
grammar: `<p>The simplest reported speech is <b>et</b> (that): <i>Ta ütles, <b>et</b> ta on haige.</i> Note the comma before <b>et</b>: Estonian always puts one there.</p>
<p>The <b>quotative mood</b> (kaudne kõneviis) adds <b>-vat</b> to show that you heard it from someone else and don't vouch for it:</p>
<div class="tbl-wrap"><table><tr><th>normal</th><th>quotative</th><th></th></tr>
<tr><td class="f">Ta on haige.</td><td class="f">Ta ole<b>vat</b> haige.</td><td>(Reportedly) he is ill.</td></tr>
<tr><td class="f">Homme sajab.</td><td class="f">Homme sada<b>vat</b>.</td><td>It's supposed to rain tomorrow.</td></tr>
<tr><td class="f">Ta ei tule.</td><td class="f">Ta ei tule<b>vat</b>.</td><td>Apparently he isn't coming.</td></tr></table></div>
<p>It's common in news and gossip. You mostly need to <b>recognise</b> it at B1; using <b>et</b> plus a certainty word (vist, ilmselt, kindlasti) is enough when speaking.</p>`,
examples: [["Ta ütles, et ta ei saa tulla.", "He / she said they can't come."], ["Naaber olevat Soome kolinud.", "The neighbour has reportedly moved to Finland."], ["Uudiste järgi tulevat külm talv.", "According to the news, a cold winter is coming."], ["Ma arvan, et sul on õigus.", "I think you're right."], ["Tundub, et hakkab sadama.", "It looks like it's going to rain."]],
drills: [["(reportedly) Ta ___ haige. (olema)", "olevat", ""], ["Ta ütles, ___ ta tuleb homme.", "et", ""], ["maybe →", "võib-olla", ""], ["Homme ___ vihma. (sadama, reportedly)", "sadavat", ""], ["definitely →", "kindlasti", ""]]

grammar: `<p><b>Formal letters</b> follow a fixed frame:</p>

{ id: "b1-7", level: "B1", title: "Minu arvates", en: "Opinions and linking words",
words: `sest|because
kuna|since, as

grammar: `<p>The B1 speaking and writing tasks reward clear structure. Learn these frames:</p>
<p><b>Minu arvates…</b> / <b>Ma arvan, et…</b> / <b>Mulle tundub, et…</b> – giving an opinion.<br>
<b>Ühelt poolt… teiselt poolt…</b> – on one hand… on the other.<br>
<b>Ma nõustun / ei nõustu sinuga.</b> – I agree / disagree with you.</p>
<p><b>Word order:</b> in a main clause the verb normally comes <b>second</b>. If you start with something other than the subject, the verb still comes second: <i>Minu arvates <b>on</b> see hea mõte.</i> <i>Talvel <b>on</b> pime.</i></p>
<p>A comma always goes before <b>et, sest, kuigi, kuna, kui</b> when they start a clause.</p>`,
examples: [["Minu arvates on Tallinnas elamine kallis.", "In my opinion, living in Tallinn is expensive."], ["Kuigi talv on pikk, meeldib mulle Eesti.", "Although winter is long, I like Estonia."], ["Ühelt poolt on maal rahulik, teiselt poolt on raske tööd leida.", "On one hand the countryside is peaceful, on the other it's hard to find work."], ["Seepärast ma õpin iga päev.", "That's why I study every day."], ["Ma ei nõustu sinuga täielikult.", "I don't fully agree with you."]],

},
{ id: "b1-8", level: "B1", title: "Kesksõnad ja des-vorm", en: "Participles and the while-doing form",
words: `avatud|open(ed)

grammar: `<p><b>-tud / -dud</b> participles describe something that <b>has been done</b>. You see them on every sign: <b>avatud</b> (open), <b>suletud</b> (closed), <b>keelatud</b> (forbidden), <b>lubatud</b> (allowed).</p>
<p><b>-nud</b> participles describe a state someone is in: <b>väsinud</b> (tired), <b>armunud</b> (in love), <b>haigestunud</b> (fallen ill).</p>
<p>The <b>des-form</b> means "while / by doing", and its subject is the same as the main verb's. Build it from the -da infinitive stem plus <b>-des</b>:</p>
<div class="tbl-wrap"><table><tr><th>verb</th><th>-da</th><th>-des</th></tr>
<tr><td class="f">lugema</td><td class="f">lugeda</td><td class="f">luge<b>des</b></td></tr>
<tr><td class="f">sõitma</td><td class="f">sõita</td><td class="f">sõit<b>es</b></td></tr>
<tr><td class="f">minema</td><td class="f">minna</td><td class="f">minn<b>es</b></td></tr>
<tr><td class="f">tegema</td><td class="f">teha</td><td class="f">teh<b>es</b></td></tr></table></div>`,
examples: [["Muuseum on esmaspäeviti suletud.", "The museum is closed on Mondays."], ["Parkimine on keelatud.", "Parking is forbidden."], ["Ta kuulab autoga sõites podcasti.", "He / she listens to a podcast while driving."], ["Lugedes õpid uusi sõnu.", "By reading you learn new words."], ["Ma olen eesti kultuurist väga huvitatud.", "I'm very interested in Estonian culture."]],
drills: [["Pood on ___. (closed)", "suletud", ""], ["Suitsetamine on ___. (forbidden)", "keelatud", ""], ["Ma õpin sõnu raamatut ___. (lugema, while)", "lugedes", ""], ["Ma olen väga ___. (tired)", "väsinud", ""], ["free of charge →", "tasuta", ""]]
}
];
UNITS.forEach(u => {
  u.vocab = u.words.trim().split("\n").map(l => { const [et, en] = l.split("|"); return { et: et.trim(), en: en.trim() }; });
});

/* ---------- Storage (per-browser, optional) ---------- */
const KEY = "samm-sammult.v1";
let store = { best: {}, missed: {} };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const PASS = 80;
const passed = id => (store.best[id] || 0) >= PASS;

/* ---------- Speech (only when the device has an Estonian voice) ---------- */
let etVoice = null;
function findVoice() {
  try {
    const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    const had = !!etVoice;
    etVoice = vs.find(v => /^et([-_]|$)/i.test(v.lang)) || null;
    if (!had && etVoice) render();
  } catch (e) {}
}
function say(text) {
  if (!etVoice) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = etVoice; u.lang = etVoice.lang; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) {}
}
const sayBtn = t => etVoice ? `<button class="say" type="button" data-say="${esc(t)}" aria-label="Listen: ${esc(t)}">▶</button>` : "";

/* ---------- Helpers ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function norm(s) { return s.toLowerCase().replace(/[?!.,;:…()"]/g, " ").replace(/\s+/g, " ").trim(); }
function plain(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/õ/g, "o"); }
const $ = s => document.querySelector(s);

/* ---------- State ---------- */
let state = { view: "path", unit: null, mode: "learn" };
let flash = null, quiz = null;

function go(view, unitId, mode) {
  state = { view, unit: unitId || null, mode: mode || "learn" };
  flash = null; quiz = null;
  render(); window.scrollTo(0, 0);
}

/* ---------- Views ---------- */
function flagHTML() {
  return `<div class="flag" role="img" aria-label="Course progress">${LEVELS.map(l => {
    const us = UNITS.filter(u => u.level === l.id), done = us.filter(u => passed(u.id)).length;
    return `<div class="stripe" data-l="${l.id}"><div class="fill" style="width:${done / us.length * 100}%"></div><span>${l.id} · ${done}/${us.length}</span></div>`;
  }).join("")}</div>`;
}

function viewPath() {
  const total = UNITS.filter(u => passed(u.id)).length;
  const next = UNITS.find(u => !passed(u.id));
  return `<div class="stack-lg">
    <section class="stack">
      <span class="eyebrow">Eesti keel · A1 → B1</span>
      <h1>Learn Estonian, step by step.</h1>
      <p class="lede">24 units across three levels. Each unit has words, a grammar note, real example sentences, flashcards and a quiz. Score ${PASS}% or more on a quiz to pass the unit and fill in your flag.</p>
      ${flagHTML()}
      <div class="row">
        ${next ? `<button class="btn primary" type="button" data-open="${next.id}">${total ? "Continue" : "Start"}: ${esc(next.title)}</button>` : `<span class="chip pass">All 24 units passed. Palju õnne!</span>`}
        <span class="meta">${total}/24 units passed</span>
      </div>
    </section>
    ${LEVELS.map(l => `<section class="stack">
      <div class="level-head"><span class="tag">${l.id}</span><h2>${l.name}</h2><span class="eyebrow">${l.en}</span><p>${l.blurb}</p></div>
      <div class="units">${UNITS.filter(u => u.level === l.id).map((u, i) => {
        const b = store.best[u.id];
        const chip = b == null ? `<span class="chip">new</span>` : b >= PASS ? `<span class="chip pass">${b}%</span>` : `<span class="chip try">${b}%</span>`;
        return `<button class="unit-btn" type="button" data-open="${u.id}"><span class="n">${l.id}.${i + 1}</span><span class="t">${esc(u.title)}</span><span class="s">${chip}</span><span class="e">${esc(u.en)}</span></button>`;
      }).join("")}</div>
    </section>`).join("")}
  </div>`;
}

function viewUnit() {
  const u = UNITS.find(x => x.id === state.unit);
  const idx = UNITS.filter(x => x.level === u.level).indexOf(u) + 1;
  const tabs = [["learn", "Learn"], ["cards", "Flashcards"], ["quiz", "Quiz"]];
  let body = "";
  if (state.mode === "learn") body = learnHTML(u);
  else if (state.mode === "cards") body = cardsHTML(u.vocab, u.id);
  else body = quizHTML(u);
  return `<div class="stack-lg">
    <section class="stack">
      <button class="back" type="button" data-go="path">← All units</button>
      <span class="eyebrow">${u.level} · Unit ${idx} of 8</span>
      <h1>${esc(u.title)}</h1>
      <p class="lede">${esc(u.en)}</p>
      <div><div class="seg" role="group" aria-label="Unit mode">${tabs.map(([k, t]) => `<button type="button" data-mode="${k}" aria-pressed="${state.mode === k}">${t}</button>`).join("")}</div></div>
    </section>
    ${body}
  </div>`;
}

function learnHTML(u) {
  return `<section class="stack"><h2>Sõnad · Words</h2>
      <ul class="vocab">${u.vocab.map(w => `<li>${sayBtn(w.et)}<span class="et">${esc(w.et)}</span><span class="en">${esc(w.en)}</span></li>`).join("")}</ul>
      <p class="small-note">Look up any word's full set of forms on <a href="https://sonaveeb.ee" target="_blank" rel="noopener">Sõnaveeb</a>, the free official dictionary.</p>
    </section>
    <section class="stack"><h2>Grammatika · Grammar</h2><div class="panel grammar">${u.grammar}</div></section>
    <section class="stack"><h2>Näited · Examples</h2>
      <ul class="ex">${u.examples.map(([et, en]) => `<li><div class="et">${sayBtn(et)}${esc(et)}</div><div class="en">${esc(en)}</div></li>`).join("")}</ul>
    </section>
    <div class="row"><button class="btn primary" type="button" data-mode="cards">Practise with flashcards</button><button class="btn" type="button" data-mode="quiz">Take the quiz</button></div>`;
}

/* Flashcards: Estonian first; tap to flip; "Again" sends the card to the back and onto the review list. */
function cardsHTML(list, ctx) {
  if (!flash || flash.ctx !== ctx) flash = { ctx, deck: shuffle(list), total: list.length, i: 0, flipped: false, reverse: false, known: 0 };
  if (!flash.deck.length) {
    return `<div class="panel stack"><h2>Nothing to review</h2><p class="lede">Words you miss in quizzes or mark "Again" on a flashcard collect here.</p><div><button class="btn primary" type="button" data-go="path">Go to the course</button></div></div>`;
  }
  if (flash.i >= flash.deck.length) {
    return `<div class="panel stack"><span class="eyebrow">Round complete</span><h2>${flash.known} of ${flash.total} known first time</h2>
      <div class="row"><button class="btn primary" type="button" data-act="restart-cards">Go again</button>${ctx !== "review" ? `<button class="btn" type="button" data-mode="quiz">Take the quiz</button>` : ""}</div></div>`;
  }
  const w = flash.deck[flash.i];
  const front = flash.reverse ? w.en : w.et, back = flash.reverse ? w.et : w.en;
  return `<section class="card-stage">
    <div class="row" style="justify-content:space-between;width:100%;max-width:460px">
      <span class="meta">${flash.i + 1} / ${flash.deck.length}</span>
      <label class="meta"><input type="checkbox" id="rev" ${flash.reverse ? "checked" : ""}> English first</label>
    </div>
    <div class="flash" id="flash" tabindex="0" role="button" aria-label="Flip card">
      <div><div class="big">${esc(flash.flipped ? back : front)}</div><div class="small">${flash.flipped ? esc(front) : "Tap to see the answer"}</div></div>
    </div>
    <div class="row">${sayBtn(w.et)}
      ${flash.flipped ? `<button class="btn bad" type="button" data-act="again">Again</button><button class="btn good" type="button" data-act="know">I knew it</button>` : `<button class="btn" type="button" data-act="flip">Show answer</button>`}
    </div>
  </section>`;
}

/* Quiz: 4 meaning choices, 2 typed words, plus the unit's grammar drills. */
function buildQuiz(u) {
  const pool = UNITS.filter(x => x.level === u.level).flatMap(x => x.vocab);
  const vs = shuffle(u.vocab);
  const qs = [];
  vs.slice(0, 4).forEach(w => {
    const wrong = shuffle(pool.filter(p => p.en !== w.en)).slice(0, 3).map(p => p.en);
    qs.push({ kind: "mc", prompt: w.et, sub: "What does this mean?", answer: w.en, options: shuffle([w.en, ...wrong]), word: w });
  });
  vs.slice(4, 6).forEach(w => qs.push({ kind: "type", prompt: w.en, sub: "Write it in Estonian", answer: w.et, word: w }));
  u.drills.forEach(([p, a, note]) => qs.push({ kind: "type", prompt: p, sub: "Fill in the gap", answer: a, note }));
  return { unit: u.id, qs: shuffle(qs), i: 0, right: 0, answered: null, typed: "" };
}

function quizHTML(u) {
  if (!quiz || quiz.unit !== u.id) quiz = buildQuiz(u);
  const n = quiz.qs.length;
  if (quiz.i >= n) {
    const pct = Math.round(quiz.right / n * 100);
    const ok = pct >= PASS;
    const nextU = UNITS[UNITS.indexOf(u) + 1];
    return `<div class="panel stack">
      <span class="eyebrow">${ok ? "Unit passed" : "Not yet"}</span>
      <div class="score">${pct}%</div>
      <p class="lede">${quiz.right} of ${n} correct. ${ok ? "Tubli! Your flag just filled in a little more." : `You need ${PASS}% to pass. Review the grammar note and try again: every attempt mixes the questions.`}</p>
      <div class="row">
        ${ok && nextU ? `<button class="btn primary" type="button" data-open="${nextU.id}">Next: ${esc(nextU.title)}</button>` : ""}
        <button class="btn${ok ? "" : " primary"}" type="button" data-act="retake">Retake quiz</button>
        <button class="btn" type="button" data-mode="learn">Back to lesson</button>
      </div></div>`;
  }
  const q = quiz.qs[quiz.i];
  let inner;
  if (q.kind === "mc") {
    inner = `<div class="choices">${q.options.map((o, k) => {
      let cls = "choice";
      if (quiz.answered) { if (o === q.answer) cls += " right"; else if (o === quiz.answered.pick) cls += " wrong"; }
      return `<button class="${cls}" type="button" data-pick="${k}" ${quiz.answered ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>`;
  } else {
    inner = `<form id="qform" class="stack" autocomplete="off">
      <input class="answer" id="qinput" type="text" lang="et" spellcheck="false" autocapitalize="off" aria-label="Your answer" value="${esc(quiz.typed)}" ${quiz.answered ? "readonly" : ""}>
      <div class="keys" aria-label="Estonian letters">${["õ", "ä", "ö", "ü", "š", "ž"].map(c => `<button type="button" data-key="${c}" ${quiz.answered ? "disabled" : ""}>${c}</button>`).join("")}</div>
      ${quiz.answered ? "" : `<div><button class="btn primary" type="submit">Check</button></div>`}
    </form>`;
  }
  let fb = "";
  if (quiz.answered) {
    const a = quiz.answered;
    fb = `<div class="feedback ${a.ok ? "ok" : "no"}">${a.ok ? "Õige! Correct." : a.almost ? `Almost. Mind the letters: <b>${esc(q.answer)}</b>` : `The answer is <b>${esc(q.answer)}</b>`}${q.note ? ` · ${esc(q.note)}` : ""}</div>
      <div><button class="btn primary" type="button" data-act="next" id="nextq">${quiz.i + 1 < n ? "Next question" : "See result"}</button></div>`;
  }
  return `<section class="panel stack">
    <div class="progress-line"><i style="width:${quiz.i / n * 100}%"></i></div>
    <div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(q.sub)}</span><span class="meta">${quiz.i + 1} / ${n}</span></div>
    <div class="q-prompt">${esc(q.prompt)}</div>
    ${inner}${fb}
  </section>`;
}

function answer(ok, extra) {
  const q = quiz.qs[quiz.i];
  quiz.answered = Object.assign({ ok }, extra || {});
  if (ok) quiz.right++;
  else if (q.word) { store.missed[q.word.et] = q.word.en; save(); }
  render();
  const nb = $("#nextq"); if (nb) nb.focus();
}

function finishQuiz() {
  const pct = Math.round(quiz.right / quiz.qs.length * 100);
  store.best[quiz.unit] = Math.max(store.best[quiz.unit] || 0, pct);
  save();
}

function viewReview() {
  const list = Object.entries(store.missed).map(([et, en]) => ({ et, en }));
  return `<div class="stack-lg">
    <section class="stack">
      <span class="eyebrow">Kordamine · Review</span>
      <h1>Words to review</h1>
      <p class="lede">Every word you miss in a quiz or mark "Again" lands here. Mark it "I knew it" to clear it from the list. ${list.length} word${list.length === 1 ? "" : "s"} waiting.</p>
    </section>
    ${cardsHTML(list, "review")}
    ${list.length ? `<div><button class="btn" type="button" data-act="clear-missed">Clear the review list</button></div>` : ""}
  </div>`;
}

function viewRef() {
  const cases = [
    ["nimetav", "nominative", "who? what?", "maja", "the base form"],
    ["omastav", "genitive", "whose?", "maja", "of the house; base for most other cases"],
    ["osastav", "partitive", "what? (part)", "maja", "objects, after numbers, negation"],
    ["sisseütlev", "illative", "into", "majja / majasse", ""],
    ["seesütlev", "inessive", "in", "majas", ""],
    ["seestütlev", "elative", "out of", "majast", ""],
    ["alaleütlev", "allative", "onto, to", "majale", "also 'to someone': mulle"],
    ["alalütlev", "adessive", "on, at", "majal", "also 'have': mul on"],
    ["alaltütlev", "ablative", "off, from", "majalt", ""],
    ["saav", "translative", "becoming", "majaks", ""],
    ["rajav", "terminative", "until", "majani", ""],
    ["olev", "essive", "as", "majana", ""],
    ["ilmaütlev", "abessive", "without", "majata", ""],
    ["kaasaütlev", "comitative", "with", "majaga", ""]
  ];
  return `<div class="stack-lg">
    <section class="stack">
      <span class="eyebrow">Teatmik · Reference</span>
      <h1>Everything in one place</h1>
      <p class="lede">The sounds, all fourteen cases, a realistic plan for reaching B1, and the free tools Estonia provides for learners.</p>
    </section>
    <section class="stack"><h2>Hääldus · Pronunciation</h2>
      <div class="panel grammar">
        <p>Estonian is written almost exactly as it is said. Every letter is pronounced, and stress is always on the <b>first syllable</b>.</p>
        <div class="tbl-wrap"><table><tr><th>letter</th><th>sounds like</th><th>example</th></tr>
          <tr><td class="f">õ</td><td>no English match: say "e" with your tongue pulled back and lips relaxed</td><td class="f">õde, sõber</td></tr>
          <tr><td class="f">ä</td><td>a in "cat"</td><td class="f">päev, tänav</td></tr>
          <tr><td class="f">ö</td><td>like German ö: say "e" with rounded lips</td><td class="f">öö, söök</td></tr>
          <tr><td class="f">ü</td><td>like German ü: say "ee" with rounded lips</td><td class="f">üks, tütar</td></tr>
          <tr><td class="f">j</td><td>y in "yes"</td><td class="f">jah, jaam</td></tr>
          <tr><td class="f">aa, ee, kk, pp…</td><td>double letters are held longer</td><td class="f">sada / saada</td></tr></table></div>
        <p>Estonian has <b>three lengths</b>: short, long and overlong. <i>linna</i> "of the city" and <i>linna</i> "into the city" are spelled the same; the second one is held longer. You will pick this up by listening, so don't let it slow you down.</p>
      </div>
    </section>
    <section class="stack"><h2>14 käänet · The 14 cases</h2>
      <div class="panel"><div class="tbl-wrap"><table>
        <tr><th>Estonian name</th><th>case</th><th>question</th><th>maja</th><th>note</th></tr>
        ${cases.map(c => `<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td class="f">${c[3]}</td><td>${c[4]}</td></tr>`).join("")}
      </table></div>
      <p class="small-note">Only the first three need memorising per word. Cases 4–14 are just endings added to the genitive.</p></div>
    </section>
    <section class="stack"><h2>Plaan · A realistic plan to B1</h2>
      <div class="plan">
        <div><h3>A1 · first 2–3 months</h3><p>Units A1.1–A1.8 here, plus the free Keeleklikk course. 30–45 minutes a day. Goal: survive the shop, the bus and small talk.</p></div>
        <div><h3>A2 · months 3–7</h3><p>Units A2.1–A2.8. Start listening to slow Estonian daily. Take the A2 exam if you need it for residence or work.</p></div>
        <div><h3>B1 · months 7–14</h3><p>Units B1.1–B1.8 and the free Keeletee course. Write one short text a week. Practise speaking with a real person.</p></div>
      </div>
      <p class="small-note">The B1 level exam (run by Harno) tests listening, reading, writing and speaking. Check harno.ee for current dates, registration and scoring.</p>
    </section>
    <section class="stack"><h2>Tasuta abi · Free official resources</h2>
      <div class="res">
        <a href="https://www.keeleklikk.ee" target="_blank" rel="noopener"><b>Keeleklikk</b><span>Free online course from zero to A2, with explanations in English.</span></a>
        <a href="https://www.keeletee.ee" target="_blank" rel="noopener"><b>Keeletee</b><span>Free online course from A2 to B1. The natural next step.</span></a>
        <a href="https://sonaveeb.ee" target="_blank" rel="noopener"><b>Sõnaveeb</b><span>Official dictionary with every inflected form and audio.</span></a>
        <a href="https://www.integratsioon.ee" target="_blank" rel="noopener"><b>Integratsiooni Sihtasutus</b><span>Free language courses, language cafés and the Estonian House.</span></a>
        <a href="https://www.settleinestonia.ee" target="_blank" rel="noopener"><b>Settle in Estonia</b><span>Adaptation programme for newcomers, including a free A1 module.</span></a>
        <a href="https://www.harno.ee" target="_blank" rel="noopener"><b>Harno</b><span>Official A1–C1 level exams: dates, sample tests, registration.</span></a>
      </div>
    </section>
    <section class="stack"><h2>Your progress</h2>
      <p class="small-note">Progress is saved only in this browser on this device.</p>
      <div class="row">${state.confirmReset
        ? `<span class="danger">Erase all quiz scores and the review list?</span><button class="btn bad" type="button" data-act="reset-yes">Yes, erase</button><button class="btn" type="button" data-act="reset-no">Cancel</button>`
        : `<button class="btn" type="button" data-act="reset">Reset progress</button>`}</div>
    </section>
  </div>`;
}

/* ---------- Render ---------- */
function render() {
  const app = $("#app");
  app.innerHTML = state.view === "unit" ? viewUnit() : state.view === "review" ? viewReview() : state.view === "ref" ? viewRef() : viewPath();
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", String(b.dataset.view === state.view || (state.view === "unit" && b.dataset.view === "path"))));
  const inp = $("#qinput"); if (inp && !quiz.answered) inp.focus({ preventScroll: true });
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-say], #flash");
  if (!t) return;
  if (t.dataset.say != null) { say(t.dataset.say); return; }
  if (t.id === "brand") return go("path");
  if (t.dataset.view) return go(t.dataset.view);
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.open) return go("unit", t.dataset.open, "learn");
  if (t.dataset.mode) { state.mode = t.dataset.mode; flash = null; quiz = null; render(); window.scrollTo(0, 0); return; }
  if (t.id === "flash") { flash.flipped = !flash.flipped; render(); return; }
  if (t.dataset.key) { const inp = $("#qinput"); quiz.typed = inp.value + t.dataset.key; inp.value = quiz.typed; inp.focus(); return; }
  if (t.dataset.pick != null) { const q = quiz.qs[quiz.i]; const pick = q.options[+t.dataset.pick]; answer(pick === q.answer, { pick }); return; }
  const act = t.dataset.act;
  if (act === "flip") { flash.flipped = true; render(); }
  else if (act === "know") {
    const w = flash.deck[flash.i];
    if (!w.again) flash.known++;
    if (flash.ctx === "review") { delete store.missed[w.et]; save(); }
    flash.i++; flash.flipped = false; render();
  }
  else if (act === "again") {
    const w = flash.deck[flash.i];
    store.missed[w.et] = w.en; save();
    flash.deck.push(Object.assign({}, w, { again: true }));
    flash.i++; flash.flipped = false; render();
  }
  else if (act === "restart-cards") { const rev = flash.reverse; flash = null; render(); if (flash) { flash.reverse = rev; render(); } }
  else if (act === "next") { quiz.i++; quiz.answered = null; quiz.typed = ""; if (quiz.i >= quiz.qs.length) finishQuiz(); render(); }
  else if (act === "retake") { quiz = null; render(); }
  else if (act === "clear-missed") { store.missed = {}; save(); flash = null; render(); }
  else if (act === "reset") { state.confirmReset = true; render(); }
  else if (act === "reset-no") { state.confirmReset = false; render(); }
  else if (act === "reset-yes") { store = { best: {}, missed: {} }; save(); state.confirmReset = false; render(); }
});

document.addEventListener("change", e => {
  if (e.target.id === "rev" && flash) { flash.reverse = e.target.checked; flash.flipped = false; render(); }
});
document.addEventListener("input", e => { if (e.target.id === "qinput" && quiz) quiz.typed = e.target.value; });
document.addEventListener("keydown", e => {
  if (e.target.id === "flash" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); flash.flipped = !flash.flipped; render(); $("#flash") && $("#flash").focus(); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "qform") return;
  e.preventDefault();
  if (quiz.answered) return;
  const q = quiz.qs[quiz.i];
  const given = norm($("#qinput").value);
  if (!given) return;
  const accepted = q.answer.split(" / ").map(norm);
  const ok = accepted.includes(given);
  const almost = !ok && accepted.map(plain).includes(plain(given));
  answer(ok, { almost });
});

const start = location.hash.slice(1).toLowerCase();
if (UNITS.some(u => u.id === start)) state = { view: "unit", unit: start, mode: "learn" };
else if (["review", "ref"].includes(start)) state.view = start;
if (window.speechSynthesis) { speechSynthesis.onvoiceschanged = findVoice; findVoice(); }
render();
</script>
</body>
</html>
