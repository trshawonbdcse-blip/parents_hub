name: Stebby probe (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/stebby/probe.mjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/stebby/probe.mjs || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B stebby-probe
          git add -f scripts/stebby/probe
          git commit -m "Stebby probe $(date -u +%F)"
          git push -f origin stebby-probe
