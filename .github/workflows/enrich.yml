name: Check new places (manual)

# Geocodes new places and collects photo/contact candidates from their websites and
# Wikimedia Commons. Results go to the enrich branch for review; the live site is untouched.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/photos/review-ids.txt', 'scripts/enrich-places.mjs']

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/enrich-places.mjs || true
      - name: Push report to enrich branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B enrich
          git add -f scripts/enrich
          git commit --allow-empty -m "Place check $(date -u +%F)"
          git push -f origin enrich
