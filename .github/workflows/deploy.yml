name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every day at 04:07 UTC (07:07 in Tallinn): refresh kids' events.
    - cron: '7 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Never publish broken data or missing translations.
      - run: node scripts/qa/check-data.mjs
      - run: node scripts/qa/check-i18n.mjs
      # Restore the event list from the previous run, so sources that only show their newest
      # listings (and temporary source failures) don't make events disappear.
      - uses: actions/cache@v4
        with:
          path: src/data/events.json
          key: events-${{ github.run_id }}
          restore-keys: events-
      - name: Collect kids' events
        run: node scripts/fetch-events.mjs
      - name: Calendar feeds
        run: node scripts/build-ics.mjs
      # Published copy for the iOS app, which refreshes events from the website.
      - run: mkdir -p public/data && cp src/data/events.json public/data/events.json
      # Family places from OpenStreetMap (refreshed weekly; the cached copy is reused in between).
      - uses: actions/cache@v4
        with:
          path: public/data/osm-places.json
          key: osm-${{ github.run_id }}
          restore-keys: osm-
      - name: Collect OpenStreetMap places
        run: node scripts/fetch-osm.mjs
      # Stebby partner list (checked weekly; the cached copy is reused in between).
      - uses: actions/cache@v4
        with:
          path: src/data/stebby.json
          key: stebby-${{ github.run_id }}
          restore-keys: stebby-
      - name: Check Stebby partners
        run: node scripts/fetch-stebby.mjs
      - run: npm run build
        env:
          # Optional: Plausible script URL (Settings → Secrets and variables → Actions → Variables).
          VITE_PLAUSIBLE_SCRIPT: ${{ vars.PLAUSIBLE_SCRIPT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
